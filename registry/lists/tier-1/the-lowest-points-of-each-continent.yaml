slug: the-lowest-points-of-each-continent
name: The Lowest Points of Each Continent
description: The lowest-elevation point on each continent — pairs naturally with the Seven Summits.
tier: 1
list_category: natural
governing_body: Geographic consensus
dimension: null
approx_count: 7
tags: []
source:
  type: static
  notes: >
    Fixed membership, not worth an API. "Lowest point" is mildly contested
    for a few continents depending on source (Europe's is sometimes given
    as the Caspian Sea shore, sometimes excluded since the Caspian's status
    as a lake vs. sea is debated; Antarctica's true lowest point is a
    subglacial basin under the ice, not a surface location) — commonly-cited
    values used here, noted per place.
