      category_path: natural.water.lake.salt_lake
      lat: 11.6613
      lng: 42.4085
      country_code: "DJ"
      description: Lowest point in Africa, at about -155m — a hypersaline crater lake in Djibouti.
    - name: Caspian Sea shore
      external_id: caspian-sea-shore
      external_id_source: manual
      category_path: natural.water.lake.salt_lake
      lat: 42.0
      lng: 50.0
      country_code: "RU"
      description: Most commonly-cited lowest point in Europe, at about -28m. The world's largest inland body of water.
    - name: Badwater Basin
